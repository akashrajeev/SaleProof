[project]
name = "saleproof"
version = "0.1.0"
description = "Catch fake festive-sale discounts on Indian e-commerce with real price history from SerpApi."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
saleproof = "saleproof.cli:main"

[tool.setuptools.packages.find]
include = ["saleproof*"]

[tool.setuptools.package-data]
saleproof = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
