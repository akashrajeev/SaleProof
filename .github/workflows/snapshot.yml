name: Daily price snapshot

# Once a day, fetch prices through SerpApi and commit the raw responses to data/raw.
# The commit history is the public, timestamped proof that the price history is real.
on:
  schedule:
    - cron: "40 3 * * *"   # 09:10 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Snapshot
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SALEPROOF_DAILY_BUDGET: "8"
          TZ: Asia/Kolkata
        run: python -m saleproof snapshot
      - name: Commit new responses
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "Snapshot $(TZ=Asia/Kolkata date +%F)"
            git push
          fi
